<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b5e20" />
      <stop offset="50%" stop-color="#2e7d32" />
      <stop offset="100%" stop-color="#388e3c" />
    </linearGradient>

    <!-- Golden Sun/Glow Accent -->
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff59d" />
      <stop offset="100%" stop-color="#fbc02d" />
    </linearGradient>

    <!-- Leaf Left Gradient -->
    <linearGradient id="leafLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5d6a7" />
      <stop offset="100%" stop-color="#e8f5e9" />
    </linearGradient>

    <!-- Leaf Right Gradient -->
    <linearGradient id="leafRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#81c784" />
      <stop offset="100%" stop-color="#c8e6c9" />
    </linearGradient>

    <!-- Water Drop Gradient -->
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e1f5fe" />
      <stop offset="100%" stop-color="#4fc3f7" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25" flood-color="#052e08" />
    </filter>
  </defs>

  <!-- Circular Outer Container -->
  <rect width="64" height="64" rx="16" fill="url(#badgeGrad)" />
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="#81c784" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Background Sun Arc -->
  <circle cx="46" cy="18" r="6" fill="url(#goldGlow)" opacity="0.9" />

  <!-- Main Sprout Group with Shadow -->
  <g filter="url(#softShadow)">
    <!-- Central Stem -->
    <path 
      d="M32 50 C32 38 31 27 32 20" 
      stroke="#ffffff" 
      stroke-width="3.5" 
      stroke-linecap="round" 
    />

    <!-- Left Sprout Leaf -->
    <path 
      d="M32 35 C24 35 15 28 17 18 C27 18 32 26 32 35 Z" 
      fill="url(#leafLeft)" 
    />

    <!-- Right Sprout Leaf -->
    <path 
      d="M32 28 C38 28 47 22 45 13 C36 13 32 20 32 28 Z" 
      fill="url(#leafRight)" 
    />

    <!-- Soil Base Arc -->
    <path 
      d="M20 50 C26 53 38 53 44 50" 
      stroke="#c8e6c9" 
      stroke-width="3" 
      stroke-linecap="round" 
    />
  </g>

  <!-- Luminous Moisture Dew Drop on Leaf -->
  <ellipse cx="23" cy="22" rx="2" ry="2.8" fill="url(#dropGrad)" transform="rotate(-25 23 22)" />
</svg>